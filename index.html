<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Fantasy RPG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .screen {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      margin: 5px 2px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #666;
    }

    button.selected {
      background: #777;
    }

    .stats {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .story {
      background: #181818;
      padding: 15px;
      border-radius: 8px;
      min-height: 150px;
      line-height: 1.7;
      margin-top: 15px;
    }

    .menu {
      margin-top: 15px;
    }

    .menu button {
      width: calc(50% - 8px);
    }

    .danger {
      background: #633;
    }

    .good {
      background: #365c42;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .small {
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>School Fantasy RPG</h1>


  <!-- 캐릭터 생성 화면 -->

  <div id="creationScreen" class="screen">

    <div class="title">캐릭터 생성</div>

    <p>이름</p>

    <input
      type="text"
      id="nameInput"
      placeholder="이름을 입력하세요"
    >

    <p>나이</p>

    <button id="age17" onclick="selectAge(17)">17세</button>
    <button id="age18" onclick="selectAge(18)">18세</button>
    <button id="age19" onclick="selectAge(19)">19세</button>

    <p>성별</p>

    <button id="genderMale" onclick="selectGender('남성')">
      남성
    </button>

    <button id="genderFemale" onclick="selectGender('여성')">
      여성
    </button>

    <br><br>

    <button class="good" onclick="startGame()">
      게임 시작
    </button>

  </div>


  <!-- 게임 화면 -->

  <div id="gameScreen" class="screen hidden">

    <div id="playerInfo"></div>

    <div id="date"></div>

    <hr>

    <div id="stats" class="stats"></div>

    <div class="menu">

      <button onclick="goSchool()">
        🏫 학교
      </button>

      <button onclick="goTown()">
        🌆 마을
      </button>

      <button onclick="goHome()">
        🏠 집
      </button>

      <button onclick="showStatus()">
        📋 상태
      </button>

    </div>

    <div id="story" class="story">
      게임을 시작하세요.
    </div>

  </div>

</div>


<script>


/* =========================
   플레이어 데이터
========================= */

let player = {

  name: "",

  age: 17,

  gender: "",

  hp: 50,

  strength: 30,

  agility: 30,

  intelligence: 40,

  social: 35,

  mental: 40,

  money: 5000,

  stress: 20

};


/* =========================
   캐릭터 생성
========================= */

let selectedAge = 17;

let selectedGender = "";


function selectAge(age) {

  selectedAge = age;

  document.getElementById("age17").classList.remove("selected");
  document.getElementById("age18").classList.remove("selected");
  document.getElementById("age19").classList.remove("selected");

  document
    .getElementById("age" + age)
    .classList.add("selected");
}


function selectGender(gender) {

  selectedGender = gender;

  document
    .getElementById("genderMale")
    .classList.remove("selected");

  document
    .getElementById("genderFemale")
    .classList.remove("selected");

  if (gender === "남성") {

    document
      .getElementById("genderMale")
      .classList.add("selected");

  } else {

    document
      .getElementById("genderFemale")
      .classList.add("selected");

  }

}


/* =========================
   게임 시작
========================= */

function startGame() {

  let name = document
    .getElementById("nameInput")
    .value
    .trim();

  if (name === "") {

    alert("이름을 입력해주세요.");

    return;
  }


  if (selectedGender === "") {

    alert("성별을 선택해주세요.");

    return;
  }


  player.name = name;

  player.age = selectedAge;

  player.gender = selectedGender;


  document
    .getElementById("creationScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  updatePlayerInfo();

  updateStats();

  updatePhase();

  updateTime();


  document.getElementById("story").innerHTML = `

    <p>
      새로운 하루가 시작되었다.
    </p>

    <p>
      당신은 오늘부터 새로운 학교생활을 시작한다.
    </p>

    <button onclick="goSchool()">
      학교에 간다
    </button>

  `;

}


/* =========================
   시간 시스템
========================= */

let hour = 7;

let minute = 30;

let day = 1;

let phase = "아침";


function advanceTime(minutes) {

  minute += minutes;


  while (minute >= 60) {

    minute -= 60;

    hour++;

  }


  if (hour >= 24) {

    hour = 0;

    day++;

  }


  updatePhase();

  updateTime();

}


/* =========================
   시간대
========================= */

function updatePhase() {

  if (hour >= 6 && hour < 8) {

    phase = "아침";

  }

  else if (hour >= 8 && hour < 12) {

    phase = "수업";

  }

  else if (hour >= 12 && hour < 13) {

    phase = "점심";

  }

  else if (hour >= 13 && hour < 16) {

    phase = "수업";

  }

  else if (hour >= 16 && hour < 19) {

    phase = "방과후";

  }

  else if (hour >= 19 && hour < 22) {

    phase = "저녁";

  }

  else {

    phase = "밤";

  }

}


/* =========================
   시간 표시
========================= */

function updateTime() {

  let period = "오전";

  let displayHour = hour;


  if (hour >= 12) {

    period = "오후";

  }


  if (hour === 0) {

    displayHour = 12;

  }

  else if (hour > 12) {

    displayHour = hour - 12;

  }


  document.getElementById("date").innerText =

    "9월 " +
    day +
    "일 · " +
    period +
    " " +
    displayHour +
    ":" +
    String(minute).padStart(2, "0") +
    " · " +
    phase;

}


/* =========================
   플레이어 정보
========================= */

function updatePlayerInfo() {

  document.getElementById("playerInfo").innerHTML = `

    <strong>
      ${player.name}
    </strong>

    · ${player.age}세

    · ${player.gender}

  `;

}


/* =========================
   능력치 표시
========================= */

function updateStats() {

  document.getElementById("stats").innerHTML = `

    ❤️ HP: ${player.hp}

    <br>

    💪 힘: ${player.strength}

    <br>

    🏃 민첩: ${player.agility}

    <br>

    🧠 지능: ${player.intelligence}

    <br>

    💬 사회성: ${player.social}

    <br>

    🧠 정신력: ${player.mental}

    <br>

    💰 돈: ${player.money}원

    <br>

    😰 스트레스: ${player.stress}

  `;

}


/* =========================
   학교
========================= */

function goSchool() {

  advanceTime(30);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      학교에 도착했다.
    </p>

    <p>
      오늘은 어떤 시간을 보낼까?
    </p>

    <button onclick="classroom()">
      교실로 간다
    </button>

    <button onclick="schoolFriend()">
      친구와 이야기한다
    </button>

  `;

}


/* =========================
   교실
========================= */

function classroom() {

  advanceTime(30);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      교실에 들어왔다.
    </p>

    <button onclick="study()">
      공부한다
    </button>

    <button onclick="lookOutside()">
      창밖을 본다
    </button>

  `;

}


/* =========================
   공부
========================= */

function study() {

  player.intelligence += 3;

  player.stress += 2;

  advanceTime(60);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      열심히 공부했다.
    </p>

    <p>
      지능이 3 상승했다.
    </p>

    <button onclick="goSchool()">
      계속 학교에 있는다
    </button>

  `;

}


/* =========================
   친구
========================= */

function schoolFriend() {

  player.social += 2;

  advanceTime(30);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      친구와 이야기를 나눴다.
    </p>

    <p>
      사회성이 2 상승했다.
    </p>

    <button onclick="goSchool()">
      계속 돌아다닌다
    </button>

  `;

}


/* =========================
   창밖
========================= */

function lookOutside() {

  advanceTime(15);


  document.getElementById("story").innerHTML = `

    <p>
      창밖을 바라보았다.
    </p>

    <p>
      학교 건물 뒤편에서
      이상한 그림자가 움직이는 것이 보였다.
    </p>

    <button onclick="goSchool()">
      신경 쓰지 않는다
    </button>

    <button onclick="goTown()">
      방과 후에 확인해본다
    </button>

  `;

}


/* =========================
   마을
========================= */

function goTown() {

  advanceTime(30);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      마을로 나왔다.
    </p>

    <button onclick="backStreet()">
      뒷골목
    </button>

    <button onclick="shop()">
      상점
    </button>

  `;

}


/* =========================
   뒷골목
========================= */

function backStreet() {

  advanceTime(20);


  document.getElementById("story").innerHTML = `

    <p>
      뒷골목에 들어섰다.
    </p>

    <p>
      불량배처럼 보이는 사람이
      길을 막고 있다.
    </p>

    <button onclick="fightEvent()">
      가까이 간다
    </button>

  `;

}


/* =========================
   싸움 이벤트
========================= */

function fightEvent() {

  advanceTime(10);


  document.getElementById("story").innerHTML = `

    <p>
      상대가 시비를 걸어왔다.
    </p>

    <button class="danger" onclick="fight()">
      싸운다
    </button>

    <button onclick="runAway()">
      도망친다
    </button>

  `;

}


/* =========================
   싸움
========================= */

function fight() {

  if (player.strength >= 30) {

    player.strength += 2;

    advanceTime(15);

    updateStats();


    document.getElementById("story").innerHTML = `

      <p>
        상대와 싸웠다.
      </p>

      <p>
        무사히 이겨냈다.
      </p>

      <p>
        힘이 2 상승했다.
      </p>

      <button onclick="goTown()">
        마을로 돌아간다
      </button>

    `;

  }

  else {

    player.hp -= 10;

    if (player.hp < 0) {
      player.hp = 0;
    }

    advanceTime(15);

    updateStats();


    document.getElementById("story").innerHTML = `

      <p>
        싸움에서 밀렸다.
      </p>

      <p>
        HP가 10 감소했다.
      </p>

      <button onclick="goTown()">
        도망친다
      </button>

    `;

  }

}


/* =========================
   도망
========================= */

function runAway() {

  player.agility += 1;

  advanceTime(10);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      재빨리 도망쳤다.
    </p>

    <p>
      민첩성이 1 상승했다.
    </p>

    <button onclick="goTown()">
      마을로 돌아간다
    </button>

  `;

}


/* =========================
   상점
========================= */

function shop() {

  advanceTime(20);


  document.getElementById("story").innerHTML = `

    <p>
      작은 상점에 들어왔다.
    </p>

    <button onclick="buySnack()">
      간식을 산다 - 100원
    </button>

    <button onclick="goTown()">
      나간다
    </button>

  `;

}


/* =========================
   간식
========================= */

function buySnack() {

  if (player.money < 100) {

    document.getElementById("story").innerHTML = `

      <p>
        돈이 부족하다.
      </p>

      <button onclick="shop()">
        돌아가기
      </button>

    `;

    return;
  }


  player.money -= 100;

  player.stress -= 3;

  if (player.stress < 0) {
    player.stress = 0;
  }

  advanceTime(10);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      간식을 먹었다.
    </p>

    <p>
      스트레스가 조금 줄었다.
    </p>

    <button onclick="goTown()">
      마을로 돌아간다
    </button>

  `;

}


/* =========================
   집
========================= */

function goHome() {

  advanceTime(30);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      집에 도착했다.
    </p>

    <button onclick="rest()">
      휴식
    </button>

    <button onclick="sleep()">
      취침
    </button>

  `;

}


/* =========================
   휴식
========================= */

function rest() {

  player.hp += 10;

  if (player.hp > 100) {
    player.hp = 100;
  }


  player.stress -= 5;

  if (player.stress < 0) {
    player.stress = 0;
  }


  advanceTime(60);

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      잠깐 쉬었다.
    </p>

    <p>
      HP가 회복되고 스트레스가 감소했다.
    </p>

    <button onclick="goHome()">
      집으로 돌아가기
    </button>

  `;

}


/* =========================
   취침
========================= */

function sleep() {

  day++;

  hour = 7;

  minute = 30;

  phase = "아침";


  player.hp += 30;

  if (player.hp > 100) {
    player.hp = 100;
  }


  player.stress -= 20;

  if (player.stress < 0) {
    player.stress = 0;
  }


  updateTime();

  updateStats();


  document.getElementById("story").innerHTML = `

    <p>
      잠에서 깨어났다.
    </p>

    <p>
      새로운 하루가 시작되었다.
    </p>

    <button onclick="goSchool()">
      학교에 간다
    </button>

    <button onclick="goTown()">
      마을로 간다
    </button>

    <button onclick="goHome()">
      집에 있는다
    </button>

  `;

}


/* =========================
   상태창
========================= */

function showStatus() {

  document.getElementById("story").innerHTML = `

    <p><strong>현재 상태</strong></p>

    <p>
      이름: ${player.name}
    </p>

    <p>
      나이: ${player.age}
    </p>

    <p>
      성별: ${player.gender}
    </p>

    <hr>

    <p>
      HP: ${player.hp}
    </p>

    <p>
      힘: ${player.strength}
    </p>

    <p>
      민첩: ${player.agility}
    </p>

    <p>
      지능: ${player.intelligence}
    </p>

    <p>
      사회성: ${player.social}
    </p>

    <p>
      정신력: ${player.mental}
    </p>

    <p>
      돈: ${player.money}원
    </p>

    <p>
      스트레스: ${player.stress}
    </p>

    <hr>

    <p class="small">
      마을 어딘가에서 이상한 일이 일어나고 있는 것 같다.
    </p>

  `;

}


</script>

</body>
</html>
